kind = "web"
previewPath = "/"
title = "Clinicos"
description = "Arabic-first clinic operations app for clinic owners and admins to securely manage clinic data, access dashboards, and connect workflows to Supabase."
version = "1.0.0"
id = "artifacts/clinicos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23675

[services.development]
run = "pnpm --filter @workspace/clinicos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clinicos", "run", "build" ]
serve = "static"
publicDir = "artifacts/clinicos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23675"
BASE_PATH = "/"
