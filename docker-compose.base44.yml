# Base44 dev environment for ClinicOS.
# Development-oriented: plain node runtime images + bind-mounted source + live-reload dev servers.
# The frontend (Vite) is the public web entry on host port 3000 and proxies /api to the API service
# (single-origin wiring, required for the app's cookie-based session auth).
services:
  install-deps:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - pnpm-store:/root/.local/share/pnpm
      - corepack-cache:/root/.cache
    command: sh -c "corepack enable && corepack prepare pnpm@9 --activate && pnpm install --no-frozen-lockfile"

  api:
    image: node:22-slim
    working_dir: /app
    depends_on:
      install-deps:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - pnpm-store:/root/.local/share/pnpm
      - corepack-cache:/root/.cache
    environment:
      - PORT=5000
      - NODE_ENV=development
      - SESSION_SECRET=base44-dev-session-secret-change-me
      # PUBLIC_APP_URL is used for password-recovery redirect links; safe dev default.
      - PUBLIC_APP_URL=http://localhost:3000
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "corepack enable && corepack prepare pnpm@9 --activate && pnpm --filter @workspace/api-server run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    image: node:22-slim
    working_dir: /app
    depends_on:
      install-deps:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - ./:/app
      - pnpm-store:/root/.local/share/pnpm
      - corepack-cache:/root/.cache
    ports:
      - "3000:5173"
    environment:
      - PORT=5173
      - BASE_PATH=/
      - NODE_ENV=development
      # Vite dev proxy target for /api -> API service (single origin)
      - API_PROXY_TARGET=http://api:5000
    command: sh -c "corepack enable && corepack prepare pnpm@9 --activate && pnpm --filter @workspace/clinicos run dev"

volumes:
  pnpm-store:
  corepack-cache:
